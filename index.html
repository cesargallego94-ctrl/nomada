    <style>
        :root {
            --espresso: #3E2723;
            --espresso-light: #4E342E;
            --latte: #D7CCC8;
            --latte-light: #efebe9;
            --bg: #FFF8F0;
            --text-dark: #212121;
            --text-light: #FFFFFF;
            --success: #2E7D32;
            --danger: #C62828;
            --excel: #107C41;
            --accent: #E65100;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 12px;
            /* Safe area para notch y barra de gestos Android */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-dark); padding-bottom: calc(72px + var(--safe-bottom)); font-size: 16px; overscroll-behavior: none; }
        
        header {
            background: linear-gradient(135deg, var(--espresso), var(--espresso-light));
            color: var(--text-light);
            padding: 14px 16px;
            padding-top: calc(14px + var(--safe-top));
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header-logo { width: 32px; height: 32px; object-fit: contain; border-radius: 50%; }
        
        .container { padding: 12px; max-width: 700px; margin: 0 auto; }
        .tab-content { display: none; animation: fadeIn 0.2s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: #fff; border: 1px solid var(--latte); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
        .card-header { font-weight: 700; margin-bottom: 12px; color: var(--espresso); display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
        
        .pos-grid { display: flex; flex-direction: column; gap: 8px; }
        .pos-item { background: #fff; border-radius: var(--radius); padding: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.04); border: 1px solid #f0e6df; }
        .pos-info h3 { font-size: 0.95rem; margin-bottom: 3px; }
        .pos-info .meta { font-size: 0.8rem; color: #777; }
        
        /* Botones táctiles 48px mínimo */
        .btn-qty { background: #f1e9e3; border: 1px solid #d9c9bf; width: 48px; height: 48px; border-radius: 50%; font-size: 1.5rem; font-weight: 700; color: var(--espresso); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s; user-select: none; }
        .btn-qty:active { background: var(--latte); transform: scale(0.95); }
        .qty-display { font-size: 1.2rem; font-weight: 700; min-width: 32px; text-align: center; }
        
        /* Cart bar con safe area para gestos Android */
        .cart-bar { background: var(--espresso); color: #fff; padding: 12px 16px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; bottom: calc(72px + var(--safe-bottom) + 8px); margin-top: 8px; box-shadow: 0 -2px 8px rgba(0,0,0,0.2); }
        
        .btn-primary { background: var(--latte); color: var(--espresso); border: none; padding: 12px 20px; font-weight: 700; border-radius: 30px; cursor: pointer; font-size: 0.95rem; white-space: nowrap; }
        .btn-sm { padding: 8px 14px; font-size: 0.85rem; border-radius: 20px; background: #fff; color: var(--espresso); border: 1px solid var(--latte); cursor: pointer; font-weight: 600; }
        .btn-sm.danger { color: var(--danger); border-color: #ef9a9a; }
        .btn-sm.success { background: var(--success); color: #fff; border: none; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.83rem; color: #555; }
        .form-control { width: 100%; padding: 11px 12px; border: 1px solid #d9c9bf; border-radius: 8px; font-size: 1rem; background: #fff; -webkit-appearance: none; color: var(--text-dark); }
        .form-control:focus { outline: 2px solid var(--espresso); border-color: var(--espresso); }
        
        .btn-block { width: 100%; background: var(--espresso); color: #fff; border: none; padding: 14px; font-size: 1rem; font-weight: 700; border-radius: 30px; cursor: pointer; }
        .btn-accent { background: var(--accent); }
        
        .history-list { background: #fff; border-radius: var(--radius); overflow: hidden; }
        .history-item { padding: 12px 14px; border-bottom: 1px solid #f0e6df; display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; }
        
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; }
        .badge-ok { background: #E8F5E9; color: #2E7D32; }
        .badge-low { background: #FFEBEE; color: #C62828; }
        
        /* Nav bar con safe area */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(60px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: #fff;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 6px;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
            z-index: 100;
        }
        .nav-item { color: #8d7b6f; font-size: 0.58rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; background: none; border: none; padding: 4px 2px; border-radius: 10px; cursor: pointer; flex: 1; min-width: 0; gap: 2px; }
        .nav-item.active { color: var(--espresso); background: #f5ece5; }
        .nav-icon { font-size: 1.2rem; line-height: 1; }
        .nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52px; }
        
        .toast { position: fixed; top: calc(80px + var(--safe-top)); left: 50%; transform: translateX(-50%); background: rgba(30,20,15,0.92); color: #fff; padding: 10px 22px; border-radius: 30px; z-index: 1005; font-size: 0.9rem; font-weight: 500; white-space: nowrap; backdrop-filter: blur(4px); }
        
        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .logo-preview { max-width: 120px; max-height: 60px; margin: 0 auto 10px; display: block; }
        
        .dashboard-card { background: var(--espresso); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-around; text-align: center; }
        .dashboard-item { flex: 1; }
        .dashboard-item .value { font-size: 1.1rem; font-weight: 700; }
        .dashboard-item .label { font-size: 0.68rem; opacity: 0.8; margin-top: 2px; }
        
        .movement-log { max-height: 200px; overflow-y: auto; font-size: 0.8rem; }

        /* Modales */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); display: none; justify-content: center; align-items: center; z-index: 1001; padding: 16px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: #fff; border-radius: var(--radius); padding: 20px; width: 100%; max-width: 460px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); animation: slideUp 0.22s ease-out; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Modal de confirmación personalizado (reemplaza confirm() nativo) */
        .confirm-box { text-align: center; }
        .confirm-box .confirm-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .confirm-box h3 { color: var(--espresso); margin-bottom: 8px; }
        .confirm-box p { color: #555; font-size: 0.9rem; margin-bottom: 18px; line-height: 1.5; }
        
        /* Ticket */
        .ticket-box { background: #FCFBF7; border: 1px dashed #888; padding: 16px; font-family: 'Courier New', Courier, monospace; color: #000; font-size: 0.85rem; border-radius: 4px; max-height: 52vh; overflow-y: auto; margin-bottom: 14px; line-height: 1.5; }
        .ticket-logo { max-width: 100px; max-height: 55px; display: block; margin: 0 auto 8px; object-fit: contain; }
        .ticket-divider { border-top: 1px dashed #888; margin: 8px 0; }
        
        /* Alerta de storage */
        .storage-warning { background: #FFF3E0; border: 1px solid #FFB74D; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 0.82rem; color: #E65100; display: none; }
        
        /* Progress bar fidelización */
        .progress-bar-container { background: #efebe9; border-radius: 6px; height: 10px; width: 100%; margin-top: 6px; overflow: hidden; border: 1px solid #d7ccc8; }
        .progress-bar { background: linear-gradient(90deg, var(--accent), #FF9800); height: 100%; width: 0%; transition: width 0.4s ease; }

        /* PWA install hint */
        .install-hint { background: linear-gradient(135deg, var(--espresso), var(--espresso-light)); color: #fff; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; display: none; font-size: 0.85rem; align-items: center; gap: 10px; }
        .install-hint.visible { display: flex; }

    <div class="container">
        <!-- Hint instalación PWA -->
        <div class="install-hint" id="install-hint">
            <span>📲 Instala esta app en tu celular para usarla sin internet.</span>
            <button id="btn-install">Instalar</button>
        </div>

        <!-- TAB: POS Principal -->
        <div id="tab-pos" class="tab-content active">
            <div id="storage-warning" class="storage-warning">
                ⚠️ El almacenamiento local está casi lleno. Exporta un backup antes de continuar.
            </div>
            <div class="card">
                <div class="card-header">📊 Resumen del día</div>
                <div class="dashboard-card" id="dashboard-today">
                    <div class="dashboard-item"><span class="value" id="dash-sales">$0</span><span class="label">Ventas</span></div>
                    <div class="dashboard-item"><span class="value" id="dash-expenses">$0</span><span class="label">Gastos</span></div>
                    <div class="dashboard-item"><span class="value" id="dash-net">$0</span><span class="label">Utilidad</span></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">💵 Caja</div>
                <div id="cash-register-status" style="margin-bottom:8px; font-weight: 600; font-size:0.9rem;"></div>
                <div class="flex-row">
                    <button class="btn-sm success" id="btn-open-cash" onclick="openCashRegisterModal()">🔓 Abrir caja</button>
                    <button class="btn-sm danger" id="btn-close-cash" style="display:none;" onclick="closeCashRegisterModal()">🔒 Cerrar caja</button>
                </div>
            </div>
            <div class="card">
                <div class="card-header">🛒 Nueva Venta</div>
                <div class="flex-row">
                    <div class="form-group" style="flex:1;">
                        <label>📅 Fecha</label>
                        <input type="date" id="sale-date" class="form-control">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>💳 Pago</label>
                        <select id="sale-payment-method" class="form-control">
                            <option value="cash">Efectivo</option>
                            <option value="transfer">Transferencia</option>
                            <option value="card">Tarjeta</option>
                            <option value="mixed">Mixto</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>👤 Cliente (opcional)</label>
                    <select id="sale-client" class="form-control"><option value="">Sin cliente</option></select>
                </div>
                <div class="form-group">
                    <label>📝 Nota interna</label>
                    <input type="text" id="sale-note" class="form-control" placeholder="Ej: sin azúcar">
                </div>
                <input type="text" id="pos-search" class="form-control" placeholder="🔍 Buscar producto..." style="margin-bottom:10px;">
                <div class="pos-grid" id="pos-products-container"></div>
                <button class="btn-sm" style="margin-top: 10px;" onclick="clearCart()">🗑️ Vaciar carrito</button>
            </div>
            <div class="cart-bar">
                <div><span style="font-size:0.8rem; opacity:0.8;">Total</span><br><strong id="cart-total" style="font-size:1.2rem;">$0</strong></div>
                <button class="btn-primary" onclick="processCheckout()">💳 Cobrar</button>
            </div>
        </div>

        <div id="tab-sales-history" class="tab-content">
            <div class="card">
                <div class="card-header">📜 Historial de Ventas</div>

                    <input type="date" id="sales-filter-from" class="form-control" style="flex:1;">
                    <input type="date" id="sales-filter-to" class="form-control" style="flex:1;">
                </div>
                <div class="flex-row" style="margin-top:8px;">
                    <button class="btn-sm success" onclick="filterSales()">Filtrar</button>
                    <button class="btn-sm" onclick="clearSalesFilter()">Todas</button>
                </div>
                <div id="full-sales-history" style="max-height:55vh; overflow-y:auto; margin-top:12px;"></div>
            </div>
        </div>

                    <select id="expense-category" class="form-control">
                        <option value="OPEX - Logística">🚚 Logística</option>
                        <option value="OPEX - Administrativo">📋 Admin</option>
                        <option value="OPEX - Personal">👤 Personal</option>
                        <option value="Inventario (Compra en Bloque)">📦 Inventario</option>
                        <option value="CAPEX">🔧 CAPEX</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Proveedor (opcional)</label>

<script>
(function () {
    'use strict';

    const STORAGE_KEY = 'NOMADA_POS_PRO_V6';
    const INITIAL_CAPITAL = 3000000;
    const clone = (obj) => JSON.parse(JSON.stringify(obj));

    const DEFAULT_INSUMOS = [
        { id: "I001", name: "Café en grano (kg)", unit: "kg", costPerUnit: 45000, stock: 2, minStock: 0.5 },
        { id: "I002", name: "Vasos 8oz", unit: "unidad", costPerUnit: 120, stock: 200, minStock: 20 },
        { id: "I003", name: "Filtros V60", unit: "unidad", costPerUnit: 80, stock: 100, minStock: 10 },
        { id: "I004", name: "Agua filtrada (L)", unit: "litro", costPerUnit: 10, stock: 50, minStock: 5 },
        { id: "I005", name: "Snack", unit: "unidad", costPerUnit: 1500, stock: 30, minStock: 5 }
    ];

    const DEFAULT_PRODUCTS = [
        { id: "P001", name: "Café filtrado 8oz", price: 6000, recipe: [{ insumoId: "I001", qty: 0.008 }, { insumoId: "I002", qty: 1 }, { insumoId: "I003", qty: 1 }, { insumoId: "I004", qty: 0.1 }] },
        { id: "P002", name: "Cold brew 12oz", price: 8500, recipe: [{ insumoId: "I001", qty: 0.015 }, { insumoId: "I002", qty: 1 }, { insumoId: "I004", qty: 0.35 }] }
    ];

    let appState = createDefaultState();
    let salesFilter = { from: '', to: '' };
    let pnlFilter = { from: '', to: '' };
    let tempExpectedCash = 0;
    let tempActiveExpense = null;
    let pendingConfirmCallback = null;
    let deferredInstallPrompt = null;
    let lastActiveTab = 'tab-pos';

    function createDefaultState() {
        const products = clone(DEFAULT_PRODUCTS);
        const cart = {};
        products.forEach(p => cart[p.id] = 0);
        return { products, insumos: clone(DEFAULT_INSUMOS), sales: [], expenses: [], clients: [], suppliers: [], inventoryMovements: [], cashRegister: { isOpen: false, initialAmount: 0, closingAmount: 0, closeDate: null, history: [] }, logo: null, cart };
    }

    function ensureStateShape(state) {
        const base = createDefaultState();
        const merged = Object.assign(base, state || {});
        merged.products = Array.isArray(merged.products) ? merged.products : clone(DEFAULT_PRODUCTS);
        merged.insumos = Array.isArray(merged.insumos) ? merged.insumos : clone(DEFAULT_INSUMOS);
        merged.sales = Array.isArray(merged.sales) ? merged.sales : [];
        merged.expenses = Array.isArray(merged.expenses) ? merged.expenses : [];
        merged.clients = Array.isArray(merged.clients) ? merged.clients.map(c => { c.points = typeof c.points === 'number' ? c.points : 0; return c; }) : [];
        merged.suppliers = Array.isArray(merged.suppliers) ? merged.suppliers : [];
        merged.inventoryMovements = Array.isArray(merged.inventoryMovements) ? merged.inventoryMovements : [];
        merged.cashRegister = merged.cashRegister && typeof merged.cashRegister === 'object' ? Object.assign({ isOpen: false, initialAmount: 0, closingAmount: 0, closeDate: null, history: [] }, merged.cashRegister) : { isOpen: false, initialAmount: 0, closingAmount: 0, closeDate: null, history: [] };
        merged.cashRegister.history = Array.isArray(merged.cashRegister.history) ? merged.cashRegister.history : [];
        merged.cart = merged.cart && typeof merged.cart === 'object' ? merged.cart : {};
        merged.products.forEach(p => { if (!(p.id in merged.cart)) merged.cart[p.id] = 0; });
        return merged;
    }

    // ── UTILIDADES ──────────────────────────────────────────────
    const $ = (id) => document.getElementById(id);

    function showModal(id) { const el = $(id); if (el) { el.style.display = 'flex'; } }
    function closeModal(id) { const el = $(id); if (el) { el.style.display = 'none'; } }

    function showConfirm(title, message, onConfirm) {
        $("confirm-title").textContent = title;
        $("confirm-message").textContent = message;
        pendingConfirmCallback = onConfirm;
        $("btn-confirm-ok").onclick = () => { closeModal("modal-confirm"); if (pendingConfirmCallback) pendingConfirmCallback(); };
        showModal("modal-confirm");
    }

    function todayISO() {
        const d = new Date();
        return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function formatCOP(n) {
        return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(Number.isFinite(n) ? n : 0);
    }

    function generateId(prefix) { return prefix + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }

    function showToast(msg, d = 2200) {
        const t = $('toast');
        if (!t) return;
        t.textContent = msg;
        t.style.display = 'block';
        clearTimeout(t._timeout);
        t._timeout = setTimeout(() => { t.style.display = 'none'; }, d);
    }

    function normalizeDate(value) {
        if (!value) return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
        const m = String(value).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
        const d = new Date(value);
        if (!Number.isNaN(d.getTime())) return d.toISOString().slice(0, 10);
        return String(value);
    }

    function displayDate(value) {
        const iso = normalizeDate(value);
        if (!iso) return '';
        const [y, m, d] = iso.split('-');
        return `${d}/${m}/${y}`;
    }

    function sameDay(recordDate, isoDate) { return normalizeDate(recordDate) === normalizeDate(isoDate); }

    // ── STORAGE ──────────────────────────────────────────────────
    function checkStorageHealth() {
        try {
            let total = 0;
            for (let k in localStorage) { if (localStorage.hasOwnProperty(k)) total += localStorage[k].length; }
            const usedKB = total / 1024;
            const warning = $('storage-warning');
            if (warning) warning.style.display = usedKB > 4000 ? 'block' : 'none';
        } catch(e) {}
    }

    function saveToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } catch(e) {
            showToast('⚠️ Error al guardar. Almacenamiento lleno — exporta un backup.', 5000);
        }
        updateActiveUI();
        checkStorageHealth();
    }

    function resetAppState() { appState = createDefaultState(); }

    function loadFromStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try { appState = ensureStateShape(JSON.parse(raw)); }
            catch (e) { console.warn('Storage inválido, reiniciando.', e); resetAppState(); }
        } else { resetAppState(); }
        const saleDate = $('sale-date');
        if (saleDate) saleDate.value = todayISO();
        if (appState.logo && $('logo-preview')) { $('logo-preview').src = appState.logo; $('logo-preview').style.display = 'block'; }
        checkLowStock(false);
        updateAllUI();
        checkStorageHealth();
    }

    // ── NAVEGACIÓN (renderizado selectivo) ────────────────────────
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        const tab = $(tabId);
        if (tab) tab.classList.add('active');
        if (btn) btn.classList.add('active');
        lastActiveTab = tabId;
        renderTabContent(tabId);
    }

    function renderTabContent(tabId) {
        renderDashboard();
        renderCashStatus();
        switch(tabId) {
            case 'tab-pos': renderPOS(); break;
            case 'tab-sales-history': renderSalesHistory(); break;
            case 'tab-gastos': renderExpenses(); populateSelects(); break;
            case 'tab-inventario': renderInventory(); renderMovementLog(); break;
            case 'tab-contactos': renderContacts(); populateSelects(); break;
            case 'tab-reportes': renderPnL(); break;
        }
    }

    function updateActiveUI() {
        renderDashboard();
        renderCashStatus();
        renderTabContent(lastActiveTab);
    }

    function updateAllUI() {
        renderDashboard(); renderCashStatus(); renderPOS();
        renderInventory(); renderMovementLog(); renderSalesHistory();
        renderExpenses(); renderPnL(); populateSelects();
        checkLowStock(false);
    }

    // ── CAJA ────────────────────────────────────────────────────
    function openCashRegisterModal() {
        if (appState.cashRegister.isOpen) return showToast('La caja ya está abierta');
        $('input-open-cash').value = String(INITIAL_CAPITAL);
        showModal('modal-open-cash');
    }

    function submitOpenCash() {
        const amount = parseFloat($('input-open-cash').value);
        if (Number.isNaN(amount) || amount < 0) return showToast('Monto inválido');
        appState.cashRegister.isOpen = true;
        appState.cashRegister.initialAmount = amount;
        appState.cashRegister.closingAmount = 0;
        appState.cashRegister.closeDate = null;
        appState.cashRegister.history.unshift({ date: todayISO(), initial: amount, closing: 0, difference: 0 });
        closeModal('modal-open-cash');
        saveToStorage();
        showToast('✅ Caja abierta');
    }

    function closeCashRegisterModal() {
        if (!appState.cashRegister.isOpen) return showToast('La caja no está abierta');
        const today = todayISO();
        const cashSales = appState.sales.filter(s => sameDay(s.date, today) && s.paymentMethod === 'cash').reduce((a, s) => a + (s.totalSale || 0), 0);
        const cashExpenses = appState.expenses.filter(e => sameDay(e.date, today) && ['OPEX - Logística','OPEX - Administrativo','OPEX - Personal','CAPEX'].includes(e.category)).reduce((a, e) => a + (e.amount || 0), 0);
        tempExpectedCash = appState.cashRegister.initialAmount + cashSales - cashExpenses;
        $('text-close-expected').textContent = `Saldo esperado: ${formatCOP(tempExpectedCash)}`;
        $('input-close-real').value = Math.round(tempExpectedCash);
        showModal('modal-close-cash');
    }

    function submitCloseCash() {
        const real = parseFloat($('input-close-real').value);
        if (Number.isNaN(real) || real < 0) return showToast('Monto inválido');
        const diff = real - tempExpectedCash;
        appState.cashRegister.closingAmount = real;
        appState.cashRegister.closeDate = new Date().toISOString();
        appState.cashRegister.isOpen = false;
        const last = appState.cashRegister.history[0];
        if (last && last.date === todayISO()) { last.closing = real; last.difference = diff; }
        closeModal('modal-close-cash');
        saveToStorage();
        showToast(`Caja cerrada · Descuadre: ${formatCOP(diff)}`);
    }

    // ── CARRITO / VENTA ─────────────────────────────────────────
    function clearCart() {
        Object.keys(appState.cart).forEach(k => appState.cart[k] = 0);
        renderPOS();
        showToast('Carrito vaciado');
    }

    function changeQty(productId, delta) {
        const product = appState.products.find(p => p.id === productId);
        if (!product) return;
        const current = appState.cart[productId] || 0;
        if (delta > 0 && Array.isArray(product.recipe)) {
            for (const ing of product.recipe) {
                const ins = appState.insumos.find(i => i.id === ing.insumoId);
                if (ins && ins.stock < (ing.qty || 0) * (current + delta)) return showToast(`Stock insuficiente: ${ins.name}`);
            }
        }
        appState.cart[productId] = Math.max(0, current + delta);
        renderPOS();
    }

    function processCheckout() {
        const saleDate = normalizeDate($('sale-date')?.value || todayISO());
        const paymentMethod = $('sale-payment-method')?.value || 'cash';
        const clientId = $('sale-client')?.value || null;
        const note = $('sale-note')?.value.trim() || '';
        const cartItems = appState.products.map(p => ({ product: p, qty: Number(appState.cart[p.id] || 0) })).filter(x => x.qty > 0);
        if (cartItems.length === 0) return showToast('No hay productos en el carrito');
        for (const { product, qty } of cartItems) {
            if (Array.isArray(product.recipe)) {
                for (const ing of product.recipe) {
                    const ins = appState.insumos.find(i => i.id === ing.insumoId);
                    if (!ins) return showToast(`Insumo no encontrado: ${ing.insumoId}`);
                    if (ins.stock < (ing.qty || 0) * qty) return showToast(`Stock insuficiente: ${ins.name}`);
                }
            }
        }
        let totalSale = 0, totalCogs = 0;
        const itemsSold = [];
        for (const { product, qty } of cartItems) {
            let prodCogs = 0;
            if (Array.isArray(product.recipe)) {
                for (const ing of product.recipe) {
                    const ins = appState.insumos.find(i => i.id === ing.insumoId);
                    const used = (ing.qty || 0) * qty;
                    ins.stock -= used;
                    prodCogs += (ins.costPerUnit || 0) * used;
                    appState.inventoryMovements.unshift({ date: saleDate, insumoId: ins.id, qty: -used, reason: `Venta: ${product.name} x${qty}` });
                }
            }
            totalSale += (product.price || 0) * qty;
            totalCogs += prodCogs;
            itemsSold.push({ id: product.id, name: product.name, qty, unitPrice: product.price || 0, cogsTotal: prodCogs });
            appState.cart[product.id] = 0;
        }
        let completedLoyaltyCycle = false;
        if (clientId) {
            const client = appState.clients.find(c => c.id === clientId);
            if (client) {
                client.points = (client.points || 0) + cartItems.reduce((acc, item) => acc + item.qty, 0);
                if (client.points >= 10) { completedLoyaltyCycle = true; client.points = client.points % 10; }
            }
        }
        const sale = { id: generateId('S'), date: saleDate, timestamp: new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }), items: itemsSold, totalSale, totalCogs, clientId, paymentMethod, note, loyaltyRewardAlert: completedLoyaltyCycle };
        appState.sales.unshift(sale);
        if ($('sale-note')) $('sale-note').value = '';
        saveToStorage();
        showToast(`✅ Venta: ${formatCOP(totalSale)}`);
        renderVisualTicket(sale);
    }

    // ── TICKET ───────────────────────────────────────────────────
    function renderVisualTicket(sale) {
        const container = $('ticket-visual-content');
        if (!container) return;
        let logoHtml = appState.logo ? `<img src="${appState.logo}" class="ticket-logo" alt="Logo">` : '';
        let itemsHtml = sale.items.map(i => `<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>${i.qty}x ${i.name}</span><span>${formatCOP(i.unitPrice * i.qty)}</span></div>`).join('');
        let loyaltyHtml = '';
        if (sale.clientId) {
            const client = appState.clients.find(c => c.id === sale.clientId);
            if (client) {
                loyaltyHtml = `<div class="ticket-divider"></div><div><strong>Cliente:</strong> ${client.name}</div><div><strong>Ruta del Café Elevado:</strong> ${client.points || 0}/10</div>`;
                if (sale.loyaltyRewardAlert) loyaltyHtml += `<div style="background:#FFF3E0;border:1px solid #FFB74D;padding:8px;margin-top:8px;font-weight:bold;color:var(--accent);text-align:center;">🎉 ¡RECOMPENSA LOGRADA!</div>`;
            }
        }
        container.innerHTML = `<div style="text-align:center;font-weight:bold;margin-bottom:6px;">${logoHtml}NÓMADA CAFETERO</div><div style="text-align:center;font-size:0.75rem;color:#555;margin-bottom:10px;">Cafetería Móvil · Medellín, CO<br>${sale.id}<br>${displayDate(sale.date)} - ${sale.timestamp}</div><div class="ticket-divider"></div>${itemsHtml}<div class="ticket-divider"></div><div style="display:flex;justify-content:space-between;font-weight:bold;font-size:1rem;"><span>TOTAL:</span><span>${formatCOP(sale.totalSale)}</span></div><div style="font-size:0.78rem;color:#555;margin-top:3px;">Pago: ${sale.paymentMethod.toUpperCase()}</div>${sale.note ? `<div style="font-size:0.78rem;color:#777;font-style:italic;">Nota: ${sale.note}</div>` : ''}${loyaltyHtml}<div class="ticket-divider"></div><div style="text-align:center;font-size:0.75rem;font-style:italic;margin-top:6px;">Gracias por compartir el ritual del café consciente. ¡Buen viaje, nómada! 🧭</div>`;
        $('btn-modal-whatsapp').onclick = () => sendWhatsAppTicket(sale);
        showModal('modal-ticket-preview');
    }

    function sendWhatsAppTicket(sale) {
        let text = `🧾 *NÓMADA CAFETERO*\nFecha: ${displayDate(sale.date)} ${sale.timestamp}\n${sale.id}\n───────────────────\n`;
        sale.items.forEach(i => text += `• ${i.qty}x ${i.name}  ${formatCOP(i.unitPrice * i.qty)}\n`);
        text += `───────────────────\n*TOTAL: ${formatCOP(sale.totalSale)}*\nPago: ${sale.paymentMethod.toUpperCase()}`;
        if (sale.note) text += `\nNota: ${sale.note}`;
        if (sale.clientId) {
            const client = appState.clients.find(c => c.id === sale.clientId);
            if (client) { text += `\n👤 Cliente: ${client.name} · Ruta ${client.points || 0}/10`; if (sale.loyaltyRewardAlert) text += `\n🎉 ¡Ciclo completo! Reclama tu beneficio.`; }
        }
        text += `\n\nGracias por apoyar el origen. ¡Buen viaje! 🧭`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    // ── INVENTARIO ───────────────────────────────────────────────
    function addInsumo() {
        const name = $('insumo-name')?.value.trim();
        const unit = $('insumo-unit')?.value.trim();
        const cost = parseFloat($('insumo-cost')?.value);
        const stock = parseFloat($('insumo-stock')?.value);
        const min = parseFloat($('insumo-min')?.value) || 0;
        if (!name || !unit || Number.isNaN(cost) || Number.isNaN(stock)) return showToast('Completa todos los campos');
        const id = `I${String(appState.insumos.length + 1).padStart(3, '0')}`;
        appState.insumos.push({ id, name, unit, costPerUnit: cost, stock, minStock: min });
        ['insumo-name','insumo-unit','insumo-cost','insumo-stock','insumo-min'].forEach(id => { if ($(id)) $(id).value = ''; });
        saveToStorage(); showToast('✅ Insumo agregado');
    }

    function addIngredientRow() {
        const container = $('recipe-ingredients');
        if (!container) return;
        const row = document.createElement('div');
        row.className = 'flex-row';
        row.style.marginBottom = '10px';
        row.innerHTML = `<select class="form-control" style="flex:2;min-width:140px;">${appState.insumos.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join('')}</select><input type="number" class="form-control" placeholder="Cant." step="any" inputmode="decimal" style="flex:1;min-width:80px;"><button class="btn-sm danger" type="button" onclick="this.parentElement.remove()">✕</button>`;
        container.appendChild(row);
    }

    function saveRecipe() {
        const name = $('recipe-name')?.value.trim();
        const price = parseFloat($('recipe-price')?.value);
        if (!name || Number.isNaN(price)) return showToast('Nombre y precio requeridos');
        const rows = document.querySelectorAll('#recipe-ingredients .flex-row');
        const recipe = [];
        rows.forEach(r => { const sel = r.querySelector('select'); const inp = r.querySelector('input[type="number"]'); if (sel && inp && inp.value !== '') { const qty = parseFloat(inp.value); if (!Number.isNaN(qty) && qty > 0) recipe.push({ insumoId: sel.value, qty }); } });
        if (recipe.length === 0) return showToast('Añade al menos un insumo');
        const id = `P${String(appState.products.length + 1).padStart(3, '0')}`;
        appState.products.push({ id, name, price, recipe });
        appState.cart[id] = 0;
        ['recipe-name','recipe-price'].forEach(id => { if ($(id)) $(id).value = ''; });
        if ($('recipe-ingredients')) $('recipe-ingredients').innerHTML = '';
        saveToStorage(); showToast('✅ Producto guardado');
    }

    function adjustInventory() {
        const insumoId = $('adj-insumo')?.value;
        const qty = parseFloat($('adj-qty')?.value);
        const reason = $('adj-reason')?.value.trim();
        if (!insumoId || Number.isNaN(qty) || qty === 0 || !reason) return showToast('Completa todos los campos');
        const ins = appState.insumos.find(i => i.id === insumoId);
        if (!ins) return showToast('Insumo no encontrado');
        if (qty < 0 && ins.stock < Math.abs(qty)) return showToast('Stock insuficiente');
        ins.stock += qty;
        appState.inventoryMovements.unshift({ date: todayISO(), insumoId, qty, reason });
        if (qty < 0) appState.expenses.unshift({ id: generateId('E'), date: todayISO(), category: 'OPEX - Administrativo', desc: `Ajuste: ${reason} (${ins.name})`, amount: Math.abs(qty) * (ins.costPerUnit || 0), supplierId: null, note: 'Merma automática' });
        if ($('adj-qty')) $('adj-qty').value = '';
        if ($('adj-reason')) $('adj-reason').value = '';
        saveToStorage(); showToast('✅ Ajuste aplicado');
    }

    // ── GASTOS ───────────────────────────────────────────────────
    function addExpense() {
        const cat = $('expense-category')?.value || 'OPEX - Administrativo';
        const desc = $('expense-desc')?.value.trim();
        const amount = parseFloat($('expense-amount')?.value);
        if (!desc || Number.isNaN(amount) || amount <= 0) return showToast('Completa descripción y monto');
        const expense = { id: generateId('E'), date: todayISO(), category: cat, desc, amount, supplierId: $('expense-supplier')?.value || null, note: $('expense-note')?.value.trim() || '' };
        appState.expenses.unshift(expense);
        if (cat === 'Inventario (Compra en Bloque)') {
            tempActiveExpense = expense;
            $('select-block-insumo').innerHTML = appState.insumos.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join('');
            $('input-block-qty').value = '';
            showModal('modal-block-replenish');
        } else { saveToStorage(); showToast('✅ Egreso registrado'); }
        ['expense-desc','expense-amount','expense-note'].forEach(id => { if ($(id)) $(id).value = ''; });
    }

    function submitBlockReplenish() {
        const insumoId = $('select-block-insumo').value;
        const qtyAdded = parseFloat($('input-block-qty').value);
        if (!insumoId || Number.isNaN(qtyAdded) || qtyAdded <= 0) return showToast('Ingresa cantidad válida');
        const ins = appState.insumos.find(i => i.id === insumoId);
        if (ins) { ins.stock += qtyAdded; appState.inventoryMovements.unshift({ date: todayISO(), insumoId: ins.id, qty: qtyAdded, reason: `Compra: ${tempActiveExpense ? tempActiveExpense.desc : 'Reposición'}` }); }
        closeModal('modal-block-replenish');
        saveToStorage();
        showToast(ins ? `✅ Stock actualizado (+${qtyAdded} ${ins.unit})` : '✅ Registrado');
    }

    // ── CONTACTOS ────────────────────────────────────────────────
    function addClient() {
        const name = $('client-name')?.value.trim();
        if (!name) return showToast('El nombre es obligatorio');
        appState.clients.unshift({ id: generateId('C'), name, whatsapp: $('client-whatsapp')?.value.trim(), address: $('client-address')?.value.trim(), points: 0 });
        ['client-name','client-whatsapp','client-address'].forEach(id => { if ($(id)) $(id).value = ''; });
        saveToStorage(); showToast('✅ Cliente registrado');
    }

    function addSupplier() {
        const name = $('supplier-name')?.value.trim();
        if (!name) return showToast('El nombre es requerido');
        appState.suppliers.unshift({ id: generateId('P'), name, whatsapp: $('supplier-whatsapp')?.value.trim(), address: $('supplier-address')?.value.trim() });
        ['supplier-name','supplier-whatsapp','supplier-address'].forEach(id => { if ($(id)) $(id).value = ''; });
        saveToStorage(); showToast('✅ Proveedor guardado');
    }

    // ── LOGO ─────────────────────────────────────────────────────
    function handleLogoUpload(e) {
        const file = e?.target?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { appState.logo = reader.result; const img = $('logo-preview'); if (img) { img.src = reader.result; img.style.display = 'block'; } saveToStorage(); showToast('✅ Logo guardado'); };
        reader.readAsDataURL(file);
    }

    function clearLogo() { appState.logo = null; const img = $('logo-preview'); if (img) { img.removeAttribute('src'); img.style.display = 'none'; } saveToStorage(); showToast('Logo eliminado'); }

    // ── RENDER FUNCTIONS ─────────────────────────────────────────
    function renderDashboard() {
        const today = todayISO();
        const s = appState.sales.filter(x => sameDay(x.date, today)).reduce((a, x) => a + (x.totalSale || 0), 0);
        const e = appState.expenses.filter(x => sameDay(x.date, today)).reduce((a, x) => a + (x.amount || 0), 0);
        if ($('dash-sales')) $('dash-sales').textContent = formatCOP(s);
        if ($('dash-expenses')) $('dash-expenses').textContent = formatCOP(e);
        if ($('dash-net')) $('dash-net').textContent = formatCOP(s - e);
    }

    function renderCashStatus() {
        const status = appState.cashRegister.isOpen ? '🔓 Abierta' : '🔒 Cerrada';
        if ($('cash-register-status')) $('cash-register-status').innerHTML = `${status} · Base: ${formatCOP(appState.cashRegister.initialAmount || 0)}`;
        if ($('btn-open-cash')) $('btn-open-cash').style.display = appState.cashRegister.isOpen ? 'none' : 'inline-block';
        if ($('btn-close-cash')) $('btn-close-cash').style.display = appState.cashRegister.isOpen ? 'inline-block' : 'none';
    }

    function renderPOS() {
        const container = $('pos-products-container');
        if (!container) return;
        const query = ($('pos-search')?.value || '').trim().toLowerCase();
        const products = appState.products.filter(p => !query || p.name.toLowerCase().includes(query));
        container.innerHTML = products.map(p => {
            const qty = appState.cart[p.id] || 0;
            return `<div class="pos-item"><div class="pos-info"><h3 style="font-size:1rem;color:var(--espresso);font-weight:700;">${p.name}</h3><div class="meta">${formatCOP(p.price || 0)}</div></div><div style="display:flex;gap:10px;align-items:center;"><button class="btn-qty" type="button" onclick="changeQty('${p.id}',-1)">−</button><span class="qty-display">${qty}</span><button class="btn-qty" type="button" onclick="changeQty('${p.id}',1)">+</button></div></div>`;
        }).join('');
        const total = appState.products.reduce((sum, p) => sum + (p.price || 0) * (appState.cart[p.id] || 0), 0);
        if ($('cart-total')) $('cart-total').textContent = formatCOP(total);
    }

    function renderInventory() {
        const el = $('adj-insumo');
        if (el) el.innerHTML = appState.insumos.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join('');
        const container = $('inventory-status-container');
        if (container) container.innerHTML = appState.insumos.map(i => { const low = Number(i.stock) <= Number(i.minStock); return `<div class="pos-item"><div class="pos-info"><h3>${i.name}</h3><div class="meta">${i.stock.toFixed(3).replace(/\.?0+$/, '')} ${i.unit} · ${formatCOP(i.costPerUnit||0)}</div></div><span class="badge ${low?'badge-low':'badge-ok'}">${low?'Bajo Stock':'OK'}</span></div>`; }).join('');
    }

    function renderMovementLog() {
        const container = $('movement-log');
        if (!container) return;
        container.innerHTML = appState.inventoryMovements.slice(0, 30).map(m => { const ins = appState.insumos.find(i => i.id === m.insumoId); const qty = Number(m.qty || 0); return `<div style="padding:7px 0;border-bottom:1px solid #f0e6df;"><strong>${displayDate(m.date)}</strong> · ${ins?.name || m.insumoId}: ${qty > 0 ? '+' : ''}${qty.toFixed(3).replace(/\.?0+$/, '')} ${ins?.unit || ''}<br><span style="color:#666;font-size:0.78rem;">${m.reason || ''}</span></div>`; }).join('');
    }

    function renderSalesHistory() {
        const container = $('full-sales-history');
        if (!container) return;
        let sales = [...appState.sales];
        if (salesFilter.from) sales = sales.filter(s => normalizeDate(s.date) >= salesFilter.from);
        if (salesFilter.to) sales = sales.filter(s => normalizeDate(s.date) <= salesFilter.to);
        container.innerHTML = sales.map(s => `<div class="history-item"><div><strong>${displayDate(s.date)}</strong>${s.timestamp ? ` · ${s.timestamp}` : ''}<br><span style="color:#555;font-size:0.83rem;">${(s.items||[]).map(i => `${i.qty}x ${i.name}`).join(', ')}</span></div><div style="text-align:right;"><strong>${formatCOP(s.totalSale||0)}</strong><br><span class="badge badge-ok">${s.paymentMethod.toUpperCase()}</span></div></div>`).join('') || '<div style="padding:12px;color:#777;">Sin ventas en rango.</div>';
    }

    function renderExpenses() {
        const container = $('expense-history');
        if (!container) return;
        container.innerHTML = appState.expenses.slice(0, 25).map(e => `<div class="history-item"><div><strong>${displayDate(e.date)}</strong><br><span style="color:#666;font-size:0.83rem;">${e.category} · ${e.desc}</span></div><strong>${formatCOP(e.amount||0)}</strong></div>`).join('') || '<div style="padding:12px;color:#777;">Sin egresos.</div>';
    }

    function renderPnL() {
        const container = $('pnl-container');
        if (!container) return;
        let sales = [...appState.sales], expenses = [...appState.expenses];
        if (pnlFilter.from) { sales = sales.filter(s => normalizeDate(s.date) >= pnlFilter.from); expenses = expenses.filter(e => normalizeDate(e.date) >= pnlFilter.from); }
        if (pnlFilter.to) { sales = sales.filter(s => normalizeDate(s.date) <= pnlFilter.to); expenses = expenses.filter(e => normalizeDate(e.date) <= pnlFilter.to); }
        const revenue = sales.reduce((a, s) => a + (s.totalSale || 0), 0);
        const cogs = sales.reduce((a, s) => a + (s.totalCogs || 0), 0);
        const opex = expenses.reduce((a, e) => a + (e.amount || 0), 0);
        const gross = revenue - cogs, net = gross - opex;
        container.innerHTML = `<div style="margin-top:12px;"><div class="dashboard-card"><div class="dashboard-item"><div class="value">${formatCOP(revenue)}</div><div class="label">Ingresos</div></div><div class="dashboard-item"><div class="value">${formatCOP(cogs)}</div><div class="label">COGS</div></div><div class="dashboard-item"><div class="value">${formatCOP(net)}</div><div class="label">Utilidad Neta</div></div></div><div style="padding:10px 4px;line-height:1.9;font-size:0.92rem;"><div>Margen Bruto: <strong>${formatCOP(gross)}</strong></div><div>OPEX Total: <strong>${formatCOP(opex)}</strong></div><div style="border-top:1px solid #ddd;margin-top:6px;font-weight:700;color:var(--espresso);">Rendimiento Neto: ${formatCOP(net)}</div></div></div>`;
    }

    function populateSelects() {
        const clients = appState.clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        const suppliers = appState.suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        if ($('sale-client')) $('sale-client').innerHTML = `<option value="">Sin cliente</option>${clients}`;
        if ($('expense-supplier')) $('expense-supplier').innerHTML = `<option value="">Sin proveedor</option>${suppliers}`;
        renderContacts(); renderRecipeIngredientOptions(); renderInventory();
    }

    function renderContacts() {
        const cl = $('clients-list');
        if (cl) cl.innerHTML = appState.clients.map(c => {
            const pts = c.points || 0, pct = Math.min(100, (pts / 10) * 100);
            const cs = appState.sales.filter(s => s.clientId === c.id);
            const spent = cs.reduce((a, s) => a + (s.totalSale || 0), 0);
            const last = cs.length > 0 ? displayDate(cs[0].date) : 'Ninguna';
            return `<div class="pos-item" style="flex-direction:column;align-items:stretch;gap:8px;"><div style="display:flex;justify-content:space-between;"><div><strong style="color:var(--espresso);">${c.name}</strong><br><span style="color:#666;font-size:0.82rem;">📱 ${c.whatsapp || 'Sin número'}</span><br><span style="color:#666;font-size:0.82rem;">📍 ${c.address || 'Sin dirección'}</span></div><div style="text-align:right;font-size:0.8rem;color:#555;"><strong>${formatCOP(spent)}</strong><br>Último: ${last}</div></div><div style="background:#FFFBF4;border:1px solid var(--latte);padding:8px;border-radius:8px;"><div style="display:flex;justify-content:space-between;font-size:0.72rem;font-weight:bold;color:var(--accent);margin-bottom:4px;"><span>🧭 RUTA DEL CAFÉ ELEVADO</span><span>${pts}/10</span></div><div class="progress-bar-container"><div class="progress-bar" style="width:${pct}%;"></div></div></div></div>`;
        }).join('') || '<div style="padding:12px;color:#777;">Sin clientes.</div>';

        const sl = $('suppliers-list');
        if (sl) sl.innerHTML = appState.suppliers.map(s => `<div class="pos-item"><div class="pos-info"><strong style="color:var(--espresso);">${s.name}</strong><br><span style="color:#666;font-size:0.82rem;">📱 ${s.whatsapp || 'Sin número'} · 📍 ${s.address || 'Sin dirección'}</span></div></div>`).join('') || '<div style="padding:12px;color:#777;">Sin proveedores.</div>';
    }

    function renderRecipeIngredientOptions() {
        document.querySelectorAll('#recipe-ingredients select').forEach(sel => { const cur = sel.value; sel.innerHTML = appState.insumos.map(i => `<option value="${i.id}">${i.name} (${i.unit})</option>`).join(''); if (cur) sel.value = cur; });
    }

    function checkLowStock(show = true) {
        const low = appState.insumos.filter(i => Number(i.stock) <= Number(i.minStock));
        if (show && low.length) showToast(`⚠️ Stock bajo: ${low.map(i => i.name).join(', ')}`, 4000);
        return low;
    }

    // ── FILTROS ──────────────────────────────────────────────────
    function filterSales() { salesFilter.from = $('sales-filter-from')?.value || ''; salesFilter.to = $('sales-filter-to')?.value || ''; renderSalesHistory(); }
    function clearSalesFilter() { salesFilter = { from: '', to: '' }; if ($('sales-filter-from')) $('sales-filter-from').value = ''; if ($('sales-filter-to')) $('sales-filter-to').value = ''; renderSalesHistory(); }
    function applyPnlFilter() { pnlFilter.from = $('pnl-from')?.value || ''; pnlFilter.to = $('pnl-to')?.value || ''; renderPnL(); }
    function clearPnlFilter() { pnlFilter = { from: '', to: '' }; if ($('pnl-from')) $('pnl-from').value = ''; if ($('pnl-to')) $('pnl-to').value = ''; renderPnL(); }

    // ── DATOS Y BACKUP ───────────────────────────────────────────
    function exportBackup() {
        const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `nomada_pos_backup_${todayISO()}.json`; a.click();
        URL.revokeObjectURL(url);
        showToast('✅ Backup JSON descargado');
    }

    function importBackup(event) {
        const file = event?.target?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { try { appState = ensureStateShape(JSON.parse(reader.result)); saveToStorage(); showToast('✅ Base restaurada'); } catch(e) { showToast('Error: archivo inválido'); } };
        reader.readAsText(file);
        if (event.target) event.target.value = '';
    }

    function exportToExcel() {
        if (!window.XLSX) return showToast('Librería Excel no disponible (offline)');
        const wb = XLSX.utils.book_new();
        const salesData = appState.sales.flatMap(s => (s.items||[]).map(i => ({ Fecha: displayDate(s.date), Hora: s.timestamp||'', Producto: i.name, Cantidad: i.qty, 'Precio Unitario': i.unitPrice||0, 'Total Bruto': s.totalSale||0, 'Método Pago': s.paymentMethod||'', Nota: s.note||'' })));
        const expensesData = appState.expenses.map(e => ({ Fecha: displayDate(e.date), Clasificacion: e.category, Descripcion: e.desc, Valor: e.amount||0, Nota: e.note||'' }));
        const inventoryData = appState.insumos.map(i => ({ ID: i.id, Insumo: i.name, Unidad: i.unit, 'Costo Unitario': i.costPerUnit||0, StockActual: i.stock, StockMinimo: i.minStock||0 }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesData), 'Ventas');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expensesData), 'Egresos');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inventoryData), 'Inventario');
        XLSX.writeFile(wb, `nomada_pos_${todayISO()}.xlsx`);
        showToast('✅ Excel exportado');
    }

    function confirmReset() {
        showConfirm('⚠️ Reiniciar Sistema', '¿Seguro que deseas borrar toda la base de datos? Perderás ventas, productos y configuraciones. Esta acción es irreversible.', () => {
            localStorage.removeItem(STORAGE_KEY);
            resetAppState(); saveToStorage();
            showToast('Sistema reiniciado');
        });
    }

    // ── PWA INSTALL ───────────────────────────────────────────────
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        const hint = $('install-hint');
        if (hint) hint.classList.add('visible');
    });

    function setupInstallButton() {
        const btn = $('btn-install');
        if (!btn) return;
        btn.addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            const { outcome } = await deferredInstallPrompt.userChoice;
            if (outcome === 'accepted') {
                $('install-hint').classList.remove('visible');
                showToast('✅ App instalada en tu pantalla de inicio');
            }
            deferredInstallPrompt = null;
        });
    }

    window.addEventListener('appinstalled', () => {
        const hint = $('install-hint');
        if (hint) hint.classList.remove('visible');
    });

    // ── REGISTRO DEL SERVICE WORKER (OFFLINE) ────────────────────
    if ('serviceWorker' in navigator) {
        const swCode = `
const CACHE = 'nomada-pos-v1';
const ASSETS = [self.location.href];

self.addEventListener('install', e => {
    e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
    self.skipWaiting();
});

self.addEventListener('activate', e => {
    e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))));
    self.clients.claim();
});

self.addEventListener('fetch', e => {
    if (e.request.method !== 'GET') return;
    e.respondWith(
        caches.match(e.request).then(cached => {
            return cached || fetch(e.request).then(resp => {
                const clone = resp.clone();
                caches.open(CACHE).then(c => c.put(e.request, clone));
                return resp;
            }).catch(() => cached);
        })
    );
});
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl, { scope: './' })
            .then(() => console.log('[Nómada POS] Service Worker activo - modo offline habilitado'))
            .catch(e => console.warn('[Nómada POS] SW no registrado:', e));
    }

    // ── INIT ─────────────────────────────────────────────────────
    function bindEvents() {
        document.querySelectorAll('.nav-item').forEach(b => {
            b.addEventListener('click', function () { switchTab(this.dataset.tab, this); });
        });
        if ($('pos-search')) $('pos-search').addEventListener('input', renderPOS);
        if ($('logo-upload')) $('logo-upload').addEventListener('change', handleLogoUpload);
        const restore = $('restore-file-input');
        if (restore) restore.addEventListener('change', importBackup);
        if ($('sale-date')) $('sale-date').value = todayISO();
        setupInstallButton();
    }

    window.addEventListener('error', (ev) => console.error('[Nómada POS] Error:', ev.error || ev.message));

    Object.assign(window, {
        openCashRegisterModal, submitOpenCash, closeCashRegisterModal, submitCloseCash,
        closeModal, processCheckout, sendWhatsAppTicket, clearCart, changeQty,
        addInsumo, addIngredientRow, saveRecipe, adjustInventory, addExpense,
        submitBlockReplenish, addClient, addSupplier, handleLogoUpload, clearLogo,
        filterSales, clearSalesFilter, applyPnlFilter, clearPnlFilter,
        exportBackup, importBackup, exportToExcel, confirmReset, switchTab
    });

    document.addEventListener('DOMContentLoaded', () => { bindEvents(); loadFromStorage(); });
})();
<\/script>
